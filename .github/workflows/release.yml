name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    name: Build Firefox Apollo Theme
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - run: npm ci

      - name: Verify source and tests
        run: |
          npm run check
          npm test
          npm run lint

      - name: Verify tag matches package versions
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          MANIFEST=$(node -p "require('./manifest.json').version")
          PACKAGE=$(node -p "require('./package.json').version")
          echo "tag=$TAG manifest=$MANIFEST package=$PACKAGE"
          if [ "$TAG" != "$MANIFEST" ] || [ "$TAG" != "$PACKAGE" ]; then
            echo "::error::Tag v$TAG must match manifest ($MANIFEST) and package ($PACKAGE) versions"
            exit 1
          fi

      - name: Build package
        run: npm run build

      - name: Generate changelog (inline commit history)
        run: |
          TAG="${GITHUB_REF_NAME}"
          PREV=$(git describe --tags --abbrev=0 "${TAG}^" 2>/dev/null || true)
          {
            echo "## Firefox Apollo Theme ${TAG}"
            echo
            if [ -n "$PREV" ]; then
              echo "### Commits since ${PREV}"
              RANGE="${PREV}..${TAG}"
            else
              echo "### Commits"
              RANGE="${TAG}"
            fi
            echo
            git log --no-merges --pretty=format:'- %s (%h) — %an' "$RANGE"
            echo
            if [ -n "$PREV" ]; then
              echo
              echo "**Full Changelog**: https://github.com/${GITHUB_REPOSITORY}/compare/${PREV}...${TAG}"
            fi
          } > CHANGELOG_RELEASE.md
          printf '%s\n' "----- release body -----"
          cat CHANGELOG_RELEASE.md

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: Firefox Apollo Theme ${{ github.ref_name }}
          files: web-ext-artifacts/firefox-apollo-theme.zip
          body_path: CHANGELOG_RELEASE.md
          draft: false
          prerelease: false
          fail_on_unmatched_files: true
          generate_release_notes: false
